version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devcanvas_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: devcanvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devcanvas_server
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/devcanvas?schema=public"
      JWT_SECRET: "devcanvas_jwt_access_secret_key_production_grade_2026"
      REFRESH_TOKEN_SECRET: "devcanvas_jwt_refresh_secret_key_production_grade_2026"
      CLIENT_URL: "http://localhost"
      NODE_ENV: "production"
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devcanvas_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
